<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShakilScript Online Compiler</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<style>
  :root{--bg:#f4f6fb;--panel:#fff;--ink:#1d2433;--muted:#6b7488;--line:#dfe3ee;--brand:#4f46e5;--run:#16a34a;--out-bg:#0f1420;--out-ink:#e6e9f2;--err:#ff6b6b}
  @media (prefers-color-scheme:dark){:root{--bg:#0d111a;--panel:#161b28;--ink:#e6e9f2;--muted:#8d96ab;--line:#262d40}}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .logo{font-weight:700;font-size:18px;letter-spacing:-.2px}
  .logo span{color:var(--brand)}
  .tag{font-size:12px;color:var(--muted)}
  .spacer{flex:1}
  select,button,a.btn{font:inherit;font-size:14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;cursor:pointer;text-decoration:none}
  button.run{background:var(--run);border-color:var(--run);color:#fff;font-weight:600;padding:7px 18px}
  button.run:disabled{opacity:.6;cursor:wait}
  button:hover,a.btn:hover{border-color:var(--brand)}
  main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
  .pane{display:flex;flex-direction:column;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .pane h2{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:9px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .pane h2 small{text-transform:none;letter-spacing:0;font-weight:400}
  .editor{flex:1;min-height:0;position:relative}
  .CodeMirror{height:100%;font:14px/1.55 ui-monospace,"Cascadia Code",Consolas,monospace}
  textarea#fallback{width:100%;height:100%;border:0;padding:12px;font:14px/1.55 ui-monospace,Consolas,monospace;background:var(--panel);color:var(--ink);resize:none;tab-size:4}
  .right{display:grid;grid-template-rows:1fr 130px;gap:12px;min-height:0}
  #out{flex:1;margin:0;padding:14px;background:var(--out-bg);color:var(--out-ink);overflow:auto;font:14px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
  #out .err{color:var(--err)}
  #out .hint{color:#7c869e}
  #stdin{flex:1;width:100%;border:0;padding:10px 14px;font:14px/1.5 ui-monospace,Consolas,monospace;background:var(--panel);color:var(--ink);resize:none}
  #stdin:focus,textarea#fallback:focus{outline:none}
  footer{padding:6px 16px 10px;font-size:12px;color:var(--muted);text-align:center}
  @media (max-width:820px){main{grid-template-columns:1fr;grid-template-rows:55vh auto}.right{grid-template-rows:260px 120px}body{overflow:auto;height:auto}html{height:auto}}
</style>
</head>
<body>
<header>
  <div class="logo">Shakil<span>Script</span> <span class="tag" style="color:var(--muted);font-weight:400">Online Compiler</span></div>
  <div class="spacer"></div>
  <select id="examples" title="Load an example program"><option>Examples…</option></select>
  <button id="clear" title="Clear editor">Clear</button>
  <a class="btn" href="/guide" target="_blank">Guidebook</a>
  <button class="run" id="run" title="Ctrl + Enter">▶ Run</button>
</header>

<main>
  <section class="pane">
    <h2>main.ss <small>Ctrl + Enter to run</small></h2>
    <div class="editor"><textarea id="fallback" spellcheck="false"></textarea></div>
  </section>

  <div class="right">
    <section class="pane">
      <h2>Output <small id="status"></small></h2>
      <pre id="out"><span class="hint">Click “Run” to execute your program.</span></pre>
    </section>
    <section class="pane">
      <h2>Input <small>one value per line, used by input()</small></h2>
      <textarea id="stdin" spellcheck="false" placeholder="Type input() values here, one per line"></textarea>
    </section>
  </div>
</main>
<footer>ShakilScript 2.0 · Python-format syntax · Compiler Design Lab project</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script>
const DEFAULT = `# Welcome to ShakilScript!
task factorial(n):
    when n <= 1:
        give 1
    give n * factorial(n - 1)

each i within span(1, 6):
    show(i, "! =", factorial(i))
`;
const $ = id => document.getElementById(id);
const store = { get(k){ try{return localStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch(e){} } };

let cm = null;
const ta = $('fallback');
if (window.CodeMirror) {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  cm = CodeMirror.fromTextArea(ta, {
    mode: 'python', lineNumbers: true, indentUnit: 4, tabSize: 4, indentWithTabs: false,
    theme: dark ? 'material-darker' : 'default', matchBrackets: false,
    extraKeys: {
      Tab: c => c.somethingSelected() ? c.indentSelection('add') : c.replaceSelection('    ', 'end'),
      'Shift-Tab': c => c.indentSelection('subtract'),
      'Ctrl-Enter': run, 'Cmd-Enter': run
    }
  });
} else {
  ta.addEventListener('keydown', e => {
    if (e.key === 'Tab') { e.preventDefault(); const s = ta.selectionStart; ta.setRangeText('    ', s, ta.selectionEnd, 'end'); }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) run();
  });
}
const getCode = () => cm ? cm.getValue() : ta.value;
const setCode = v => cm ? cm.setValue(v) : (ta.value = v);

setCode(store.get('ss_code') || DEFAULT);
$('stdin').value = store.get('ss_stdin') || '';
setInterval(() => { store.set('ss_code', getCode()); store.set('ss_stdin', $('stdin').value); }, 1500);

async function run() {
  const btn = $('run'), out = $('out'), st = $('status');
  btn.disabled = true; btn.textContent = 'Running…'; st.textContent = '';
  try {
    const r = await fetch('/api/run', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ code: getCode(), stdin: $('stdin').value })
    });
    const d = await r.json();
    out.textContent = '';
    const failed = d.exit_code !== 0;
    const span = document.createElement('span');
    span.textContent = d.output || (failed ? '' : '(no output)');
    out.appendChild(span);
    // highlight the error line printed by the interpreter
    if (failed && /ShakilScript error|SyntaxError|Error/.test(d.output)) span.className = 'err';
    st.textContent = (failed ? '✗ exited with code ' + d.exit_code : '✓ finished') + ' · ' + d.time_ms + ' ms';
  } catch (e) {
    out.innerHTML = '';
    const s = document.createElement('span'); s.className = 'err';
    s.textContent = 'Could not reach the server. Is it running?'; out.appendChild(s);
  } finally { btn.disabled = false; btn.textContent = '▶ Run'; }
}
$('run').onclick = run;
$('clear').onclick = () => { setCode(''); $('out').innerHTML = '<span class="hint">Click “Run” to execute your program.</span>'; };

fetch('/api/examples').then(r => r.json()).then(list => {
  const sel = $('examples');
  list.forEach((e, i) => sel.add(new Option(e.name, i)));
  sel.onchange = () => {
    if (sel.value === '' || isNaN(sel.value)) return;
    const e = list[+sel.value];
    setCode(e.code); $('stdin').value = e.stdin || '';
    sel.selectedIndex = 0;
  };
}).catch(() => {});
</script>
</body>
</html>
